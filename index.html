
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#9bc84b">
    <meta name="description" content="Giáo dục Nhật Minh - Tuyển sinh, đào tạo và kết nối tri thức">
    <title>Giáo dục Nhật Minh | Tuyển sinh và đào tạo</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Be Vietnam Pro', sans-serif; }
        body { background: #f8f9fa; color: #333; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        header.header { background: #0b4121 !important; color: white; padding-bottom: 0; }
        .header-main { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; }
        .brand { display: flex; align-items: center; text-decoration: none; color: white; }
        .brand-logo { background: #9bc84b; color: white; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 8px; margin-right: 12px; }
        .brand-title { font-size: 20px; font-weight: 700; }
        .brand-subtitle { font-size: 11px; color: #cfcfcf; letter-spacing: 1px; }
        .hotline { display: flex; align-items: center; color: white; }
        .hotline i { font-size: 20px; color: #9bc84b; margin-right: 10px; }
        .hotline-number { color: #9bc84b; font-weight: bold; text-decoration: none; }
        .nav-bar { background: #13552d; padding: 10px 0; }
        .nav-menu { display: flex; list-style: none; gap: 20px; }
        .nav-menu a { color: white; text-decoration: none; font-size: 14px; font-weight: 500; }
        .nav-menu a.active { color: #9bc84b; font-weight: bold; }
        .hero-section { padding: 60px 0; background: white; }
        .hero-container { display: flex; align-items: center; justify-content: space-between; gap: 40px; }
        .hero-text { flex: 1; }
        .hero-image { flex: 1; text-align: right; }
        .hero-image img { max-width: 100%; border-radius: 12px; }
        .badge { background: #e8f5e9; color: #2e7d32; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; margin-bottom: 15px; }
        h2 { font-size: 42px; line-height: 1.2; margin-bottom: 20px; color: #111; }
        .hero-buttons { margin-top: 25px; display: flex; gap: 15px; }
        .btn { padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: 600; display: inline-block; }
        .btn-primary { background: #0b4121; color: white; }
        .btn-secondary { background: #f1f1f1; color: #333; }
        .stats-section { background: #0b4121; color: white; padding: 40px 0; text-align: center; }
        .stats-grid { display: flex; justify-content: space-around; }
        .stat-number { font-size: 32px; font-weight: 700; color: #9bc84b; display: block; }
        .about-section, .programs-section, .contact-section { padding: 80px 0; }
        .about-grid, .contact-container { display: flex; gap: 50px; }
        .about-content, .contact-info, .contact-form-wrapper { flex: 1; }
        .section-subtitle { color: #2e7d32; font-weight: bold; text-transform: uppercase; font-size: 13px; display: block; margin-bottom: 10px; }
        .section-title { font-size: 28px; margin-bottom: 20px; }
        .about-features { list-style: none; margin-top: 20px; }
        .about-features li { margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .about-features li i { color: #2e7d32; }
        .programs-grid { display: flex; gap: 20px; margin-top: 30px; }
        .program-card { flex: 1; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .program-image img { width: 100%; height: 200px; object-fit: cover; }
        .program-body { padding: 20px; }
        .program-link { color: #0b4121; text-decoration: none; font-weight: bold; margin-top: 15px; display: inline-block; }
        .contact-details { margin-top: 30px; }
        .contact-item { display: flex; gap: 15px; margin-bottom: 20px; }
        .contact-item i { color: #0b4121; font-size: 20px; margin-top: 3px; }
        .contact-form { display: flex; flex-direction: column; gap: 15px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn-block { width: 100%; text-align: center; border: none; cursor: pointer; }
        .footer { background: #111; color: #fff; padding: 60px 0 20px; }
        .footer-grid { display: flex; justify-content: space-between; gap: 40px; }
        .footer-brand, .footer-links, .footer-newsletter { flex: 1; }
        .footer-links ul { list-style: none; }
        .footer-links ul li { margin-bottom: 10px; }
        .footer-links ul li a { color: #ccc; text-decoration: none; }
        .footer-bottom { border-top: 1px solid #222; margin-top: 40px; padding-top: 20px; text-align: center; color: #777; font-size: 13px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-main">
            <a href="#home" class="brand">
                <div class="brand-logo">
                    <span class="logo-text">NM</span>
                </div>
                <div class="brand-text">
                    <h1 class="brand-title">GIÁO DỤC NHẬT MINH</h1>
                    <p class="brand-subtitle">ĐỒNG HÀNH CÙNG BẠN - KIẾN TẠO TƯƠNG LAI</p>
                </div>
            </a>
            <div class="header-right">
                <div class="hotline">
                    <i class="fas fa-phone-alt"></i>
                    <div class="hotline-text">
                        <span>Hotline tư vấn</span>
                        <a href="tel:0372484382" class="hotline-number">0372 484 382</a>
                    </div>
                </div>
            </div>
        </div>
        <nav class="nav-bar">
            <div class="container">
                <ul class="nav-menu">
                    <li><a href="#home" class="active">Trang chủ</a></li>
                    <li><a href="#about">Giới thiệu</a></li>
                    <li><a href="#programs">Chương trình đào tạo</a></li>
                    <li><a href="https://nhatminhedu.vn" target="_blank">Học trực tuyến</a></li>
                </ul>
            </div>
        </nav>
    </header>
</body>
</html>
