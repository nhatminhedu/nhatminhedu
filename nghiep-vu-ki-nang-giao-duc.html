<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nghiệp vụ và Kĩ năng Giáo dục - Giáo dục Nhật Minh</title>
    <style>
        :root {
            --primary: #244a38;
            --primary-light: #356850;
            --accent: #e67e22;
            --bg-body: #f4f6f5;
            --bg-card: #ffffff;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.7;
        }

        /* Thanh điều hướng đầu trang */
        .top-bar {
            background-color: var(--primary);
            padding: 15px 20px;
        }

        .top-bar-inner {
            max-width: 960px;
            margin: 0 auto;
        }

        .btn-back {
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .btn-back:hover {
            opacity: 0.85;
        }

        /* Khung bài viết chính */
        .container {
            max-width: 960px;
            margin: 30px auto;
            background: var(--bg-card);
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 40px 45px;
        }

        .category-badge {
            display: inline-block;
            background-color: #e6efe9;
            color: var(--primary);
            font-weight: 700;
            font-size: 12.5px;
            padding: 5px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
        }

        h1.article-title {
            font-size: 27px;
            color: var(--primary);
            line-height: 1.35;
            margin-bottom: 22px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .intro-box {
            background-color: #f7faf8;
            border-left: 4px solid var(--primary);
            border-radius: 0 10px 10px 0;
            padding: 20px 24px;
            margin-bottom: 32px;
            font-size: 15.5px;
            color: var(--text-muted);
        }

        .intro-box p {
            margin-bottom: 12px;
        }

        .intro-box p:last-child {
            margin-bottom: 0;
        }

        .intro-box strong {
            color: var(--primary);
        }

        h2.section-heading {
            font-size: 20px;
            color: var(--primary);
            margin-top: 32px;
            margin-bottom: 14px;
            font-weight: 700;
        }

        ul.styled-list, ol.styled-list {
            padding-left: 22px;
            margin-bottom: 20px;
            color: var(--text-muted);
            font-size: 15.5px;
        }

        ul.styled-list li, ol.styled-list li {
            margin-bottom: 10px;
        }

        ul.styled-list li strong, ol.styled-list li strong {
            color: var(--text-main);
        }

        /* Bảng danh mục khóa học */
        .table-wrapper {
            overflow-x: auto;
            margin: 18px 0 30px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th {
            background-color: var(--primary);
            color: #ffffff;
            text-align: left;
            padding: 13px 16px;
            font-size: 14.5px;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 14.5px;
            color: var(--text-muted);
            vertical-align: top;
        }

        tr:nth-child(even) {
            background-color: #f9fbfa;
        }

        td strong {
            color: var(--primary);
        }

        /* Khung CTA xanh rêu */
        .cta-banner {
            background-color: var(--primary);
            color: #ffffff;
            border-radius: 12px;
            padding: 36px 30px;
            text-align: center;
            margin-top: 36px;
        }

        .cta-banner h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .cta-banner p {
            font-size: 15px;
            max-width: 720px;
            margin: 0 auto 24px;
            opacity: 0.95;
            line-height: 1.6;
        }

        .cta-buttons {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-orange, .btn-white {
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            padding: 13px 26px;
            border-radius: 8px;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-orange {
            background-color: var(--accent);
            color: #ffffff;
        }

        .btn-orange:hover {
            background-color: #d35400;
            transform: translateY(-2px);
        }

        .btn-white {
            background-color: #ffffff;
            color: var(--primary);
        }

        .btn-white:hover {
            background-color: #f3f4f6;
            transform: translateY(-2px);
        }

        /* Popup Modal Đăng ký & Lịch khai giảng */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-box {
            background: #ffffff;
            width: 100%;
            max-width: 540px;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            position: relative;
        }

        .modal-box.modal-wide {
            max-width: 780px;
        }

        .modal-header {
            background-color: var(--primary);
            color: #ffffff;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 18px;
            font-weight: 700;
        }

        .btn-close {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 26px;
            line-height: 1;
            cursor: pointer;
            opacity: 0.85;
        }

        .btn-close:hover {
            opacity: 1;
        }

        .modal-body {
            padding: 24px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14.5px;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
        }

        .btn-submit:hover {
            background-color: #d35400;
        }

        .zalo-quick {
            margin-top: 14px;
            text-align: center;
            font-size: 13.5px;
            color: var(--text-muted);
        }

        .zalo-quick a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        .success-msg {
            display: none;
            text-align: center;
            padding: 20px 10px;
        }

        .success-msg h4 {
            color: var(--primary);
            font-size: 19px;
            margin-bottom: 10px;
        }

        .badge-status {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            font-weight: 700;
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 12px;
        }

        @media (max-width: 600px) {
            .container { margin: 15px; padding: 25px 20px; }
            h1.article-title { font-size: 21px; }
            .cta-banner { padding: 28px 18px; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="top-bar-inner">
            <a href="index.html" class="btn-back">← Quay lại Trang chủ Giáo dục Nhật Minh</a>
        </div>
    </div>

    <div class="container">
        <span class="category-badge">NGHIỆP VỤ &amp; KĨ NĂNG GIÁO DỤC</span>
        <h1 class="article-title">Đào tạo &amp; Bồi dưỡng Nghiệp vụ và Kĩ năng Giáo dục – Vững bước nghề giáo</h1>
        
        <div class="intro-box">
            <p>
